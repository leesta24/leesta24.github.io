<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lest</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
      color: #1d1d1f;
      background: #fbfbfd;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      max-width: 680px;
      margin: 0 auto;
      padding: 0 24px;
    }

    main {
      min-height: 100vh;
      display: flex;
      align-items: center;
    }

    .content {
      padding: 80px 0;
      width: 100%;
    }

    .greeting {
      font-size: 14px;
      font-weight: 500;
      color: #86868b;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      margin-bottom: 16px;
    }

    h1 {
      font-size: 48px;
      font-weight: 600;
      letter-spacing: -0.025em;
      line-height: 1.1;
      margin-bottom: 20px;
    }

    .subtitle {
      font-size: 20px;
      font-weight: 400;
      color: #6e6e73;
      line-height: 1.5;
      margin-bottom: 56px;
    }

    section {
      margin-bottom: 48px;
    }

    .section-title {
      font-size: 12px;
      font-weight: 600;
      color: #86868b;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-bottom: 16px;
    }

    .tech-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .tech-tag {
      font-size: 14px;
      font-weight: 500;
      color: #1d1d1f;
      background: #f5f5f7;
      padding: 6px 14px;
      border-radius: 100px;
      transition: background 0.2s;
    }

    .tech-tag:hover {
      background: #e8e8ed;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .links a {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-size: 15px;
      color: #1d1d1f;
      text-decoration: none;
      transition: color 0.2s;
    }

    .links a:hover {
      color: #0071e3;
    }

    .links svg {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
    }

    footer {
      padding: 24px 0;
      border-top: 1px solid #e8e8ed;
    }

    footer p {
      font-size: 13px;
      color: #86868b;
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 36px;
      }

      .subtitle {
        font-size: 17px;
        margin-bottom: 40px;
      }
    }
  </style>
</head>

            <span class="tech-tag">Next.js</span>

  </main>

</html>
